<!DOCTYPE html>

   <style>
      body {
         background-color: #07131e;
         color: #e6edf3;
         font-family: 'Montserrat', sans-serif;
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 2rem 1rem;
         margin: 0;
      }
      .tn-404-container {
         max-width: 580px;
         text-align: center;
         background: rgba(14, 27, 42, 0.75);
         border: 1px solid rgba(196, 155, 72, 0.25);
         border-radius: 12px;
         padding: 3rem 2.5rem;
         box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
         backdrop-filter: blur(10px);
      }
      .tn-404-code {
         font-family: 'Playfair Display', serif;
         font-size: 5.5rem;
         font-weight: 700;
         color: #c49b48;
         line-height: 1;
         margin-bottom: 0.5rem;
         letter-spacing: 2px;
      }
      .tn-404-title {
         font-size: 1.4rem;
         font-weight: 600;
         margin-bottom: 1rem;
         color: #ffffff;
      }
      .tn-404-desc {
         color: #94a3b8;
         font-size: 0.95rem;
         line-height: 1.6;
         margin-bottom: 2rem;
      }
      .tn-404-btn {
         display: inline-flex;
         align-items: center;
         gap: 0.5rem;
         background: #c49b48;
         color: #07131e;
         font-weight: 600;
         font-size: 0.9rem;
         padding: 0.75rem 1.75rem;
         border-radius: 6px;
         text-decoration: none;
         transition: all 0.25s ease;
      }
      .tn-404-btn:hover {
         background: #d4ab58;
         color: #050e17;
         transform: translateY(-2px);
         box-shadow: 0 8px 20px rgba(196, 155, 72, 0.3);

      .tn-404-logo {
         height: 48px;
         width: auto;
         margin-bottom: 1.75rem;

<body>
   <div class="tn-404-container">

      <div class="tn-404-code">404</div>
      <h1 class="tn-404-title">Page Not Found</h1>

      <div class="d-flex flex-wrap gap-2 justify-content-center">
         <a href="/" class="tn-404-btn">
            <i class="fa-solid fa-house"></i> Return to Home
